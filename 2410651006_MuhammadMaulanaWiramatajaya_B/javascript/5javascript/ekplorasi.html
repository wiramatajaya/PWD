<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Mini Project</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; }
        section { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #1a73e8; font-size: 1.2rem; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        button#btn-tambah { padding: 10px 15px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; }
        
        ul { list-style: none; padding: 0; }
        li { background: #f8f9fa; margin-bottom: 8px; padding: 10px 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .btn-hapus { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-hapus:hover { background: #cc0000; }
    </style>
</head>
<body>

    <section>
        <h2>Tugas Eksplorasi: Daftar Data</h2>
        <div class="input-group">
            <input type="text" id="input-eks" placeholder="Tambah data baru...">
            <button id="btn-eks">Tambah</button>
        </div>
        <ul id="list-eks">
            </ul>
    </section>

  
    <script src="eksplorasi.js"></script>
</body>
</html>
