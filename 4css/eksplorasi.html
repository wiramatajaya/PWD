<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas Eksplorasi - Form Sederhana</title>
<link rel="stylesheet" href="eksplorasi.css">
</head>
<body>
    <h2>Formulir Kontak Sederhana</h2>
    <form action="#" method="POST">
        <div class="form-input">
            <label for="nama">Nama:</label>
            <input type="text" id="nama" name="nama" placeholder="my jhonyyy" required>
        </div>
        <div class="form-input">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="jhonnasfaf2344@mail.com" required>
        </div>

        <div class="form-input">
            <label>Jenis Kelamin:</label>
            <input type="radio" id="laki" name="jk" value="Laki-laki">
            <label for="laki" class="inline-label">Laki-laki</label>
            <input type="radio" id="perempuan" name="jk" value="Perempuan">
            <label for="perempuan" class="inline-label">Perempuan</label>
        </div>

        <div class="form-input">
            <label class="comment">Hobi (Pilih minimal 3):</label>
            <input type="checkbox" id="hobi1" name="hobi" value="Coding">
            <label for="hobi1" class="inline-label">Coding</label>
            <input type="checkbox" id="hobi2" name="hobi" value="Membaca">
            <label for="hobi2" class="inline-label">Membaca</label>
            <input type="checkbox" id="hobi3" name="hobi" value="Olahraga">
            <label for="hobi3" class="inline-label">Olahraga</label>
        </div>

        <div class="form-input">
            <label for="pesan">Pesan:</label>
            <textarea id="pesan" name="pesan" rows="4"></textarea>
        </div>

        <button type="submit">Kirim Data</button>
    </form>
</body>
</html>
